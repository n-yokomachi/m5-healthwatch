; HealthWatch. Runs from the ota_1 partition next to the launcher menu (../menu, ota_0),
; so it uses the same partition table and the same Arduino/ESP-IDF platform as the menu.
[platformio]
default_envs = m5stopwatch

[env:m5stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; writes src/env_config.h (Wi-Fi and the agent settings) from ../.env
extra_scripts = pre:scripts/env_config.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5GFX.git
    https://github.com/m5stack/M5Unified.git
    bblanchon/ArduinoJson@^7

; Host-side unit tests for logic that does not depend on Arduino (pio test -e native)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = bblanchon/ArduinoJson@^7
build_src_filter = -<*> +<hw/workout.cpp> +<hw/reply.cpp> +<hw/chunked.cpp>
build_flags = -std=gnu++17
